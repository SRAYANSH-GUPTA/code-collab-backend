name: Deploy to AWS EC2

on:
  push:
    branches:
      - master  # Changed from main to master
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production  # Use GitHub environment for protection

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          # Start ssh-agent and add key with passphrase
          eval $(ssh-agent -s)
          # Save agent info for subsequent steps
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

          # Add key to agent with passphrase
          echo "$SSH_PASSPHRASE" | SSH_ASKPASS_REQUIRE=never ssh-add ~/.ssh/id_rsa

      - name: Build container image
        run: |
          echo "🔨 Building container image with Docker..."
          docker build -t codecollab-backend:latest -f Dockerfile .
          echo "💾 Saving image to tar file..."
          docker save codecollab-backend:latest | gzip > /tmp/codecollab-backend.tar.gz
          echo "✅ Image saved: $(du -h /tmp/codecollab-backend.tar.gz | cut -f1)"

      - name: Create deployment package
        run: |
          # Create tarball excluding sensitive files
          tar -czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='node_modules' \
            --warning=no-file-changed \
            -C . .

      - name: Upload to EC2
        env:
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "📤 Uploading deployment package..."
          scp -o StrictHostKeyChecking=no /tmp/deploy.tar.gz $EC2_USERNAME@$EC2_HOST:/tmp/
          echo "📤 Uploading container image..."
          scp -o StrictHostKeyChecking=no /tmp/codecollab-backend.tar.gz $EC2_USERNAME@$EC2_HOST:/tmp/

      - name: Deploy on EC2
        env:
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          LAMBDA_ARN_TYPESCRIPT: ${{ secrets.LAMBDA_ARN_TYPESCRIPT }}
          LAMBDA_ARN_PYTHON: ${{ secrets.LAMBDA_ARN_PYTHON }}
          LAMBDA_ARN_DART: ${{ secrets.LAMBDA_ARN_DART }}
          LAMBDA_ARN_GO: ${{ secrets.LAMBDA_ARN_GO }}
          LAMBDA_ARN_CPP: ${{ secrets.LAMBDA_ARN_CPP }}
          TURN_SERVERS: ${{ secrets.TURN_SERVERS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << 'ENDSSH'
            set -e  # Exit on error

            APP_DIR="$HOME/codecollab-backend"
            BACKUP_DIR="$HOME/codecollab-backup-$(date +%Y%m%d-%H%M%S)"

            echo "📦 Preparing deployment..."

            # Create backup of current deployment
            if [ -d "$APP_DIR" ]; then
              echo "💾 Creating backup..."
              cp -r "$APP_DIR" "$BACKUP_DIR"
            fi

            # Extract new code
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            # Create .env file with secrets (DO NOT ECHO THESE)
            echo "🔐 Configuring environment..."
            cat > .env << 'EOF'
          ENV=production
          PORT=8081

          # Supabase Authentication
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}

          # AWS Configuration
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}

          # Lambda ARNs for Code Execution
          LAMBDA_ARN_TYPESCRIPT=${{ secrets.LAMBDA_ARN_TYPESCRIPT }}
          LAMBDA_ARN_PYTHON=${{ secrets.LAMBDA_ARN_PYTHON }}
          LAMBDA_ARN_DART=${{ secrets.LAMBDA_ARN_DART }}
          LAMBDA_ARN_GO=${{ secrets.LAMBDA_ARN_GO }}
          LAMBDA_ARN_CPP=${{ secrets.LAMBDA_ARN_CPP }}

          # WebRTC Configuration
          TURN_SERVERS=${{ secrets.TURN_SERVERS }}
          TURN_USERNAME=${{ secrets.TURN_USERNAME }}
          TURN_PASSWORD=${{ secrets.TURN_PASSWORD }}
          STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
          PUBLIC_IP=${{ secrets.PUBLIC_IP }}
          UDP_MIN_PORT=50000
          UDP_MAX_PORT=50100

          # Monitoring
          LOKI_URL=http://loki:3100

          # Feature Flags
          USE_MOCK_LAMBDA=false
          USE_MOCK_AUTH=false
          EOF

            # Secure .env file
            chmod 600 .env

            # Deploy using podman-compose
            echo "🛑 Stopping old containers..."
          
            podman-compose down || true

            echo "📦 Loading pre-built container image..."
            gunzip -c /tmp/codecollab-backend.tar.gz | podman load
            rm /tmp/codecollab-backend.tar.gz

            echo "🏷️  Tagging image for podman-compose..."
            podman tag codecollab-backend:latest codecollab-backend:local

            echo "▶️  Starting new containers..."
            podman-compose up -d --no-build

            # Wait for app to start
            echo "⏳ Waiting for application..."
            sleep 10

            # Health check
            echo "🏥 Running health check..."
            MAX_ATTEMPTS=15
            for i in $(seq 1 $MAX_ATTEMPTS); do
              if curl -f http://localhost:8081/health > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                break
              fi
              if [ $i -eq $MAX_ATTEMPTS ]; then
                echo "❌ Health check failed!"
                echo "Rolling back..."
                podman-compose down
                if [ -d "$BACKUP_DIR" ]; then
                  rm -rf "$APP_DIR"
                  mv "$BACKUP_DIR" "$APP_DIR"
                  cd "$APP_DIR"
                  podman-compose up -d
                fi
                exit 1
              fi
              echo "Waiting... ($i/$MAX_ATTEMPTS)"
              sleep 2
            done

            # Clean up old images
            echo "🧹 Cleaning up..."
            podman image prune -f --filter "until=72h" || true

            # Remove backup if successful
            if [ -d "$BACKUP_DIR" ]; then
              rm -rf "$BACKUP_DIR"
            fi

            echo "✅ Deployment successful!"
            podman-compose ps
          ENDSSH

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "🔍 Verifying deployment..."
          # Wait a bit for Nginx to pick up changes
          sleep 5

          # Test HTTPS endpoint
          if curl -f -k https://$EC2_HOST/health; then
            echo "✅ HTTPS endpoint is healthy"
          else
            echo "⚠️  Warning: HTTPS endpoint check failed"
          fi

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Deployment to production successful!"
          echo "🔗 Application: https://${{ secrets.EC2_HOST }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"

      - name: Rollback notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "🔄 Automatic rollback initiated"
          echo "📝 Failed commit: ${{ github.sha }}"
